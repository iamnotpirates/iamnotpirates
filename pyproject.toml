[project]
name = "iamnotpirates"
version = "1.0.1"
description = "IDLIX CLI Scraper & Stream Downloader"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "curl-cffi>=0.7.0",
    "beautifulsoup4>=4.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "playwright>=1.60.0",
    "yt-dlp>=2025.10.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
